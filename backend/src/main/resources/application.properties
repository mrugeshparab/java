spring.application.name=CampusNest
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campusnest?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:campusnest}
spring.datasource.password=${DB_PASSWORD:campusnest}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.jackson.serialization.write-dates-as-timestamps=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
campusnest.upload-dir=${CAMPUSNEST_UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=50MB
